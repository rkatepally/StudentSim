name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,baselines]"
      - name: Ruff changed Python paths
        run: |
          ruff check studentsim/baselines/llamacpp.py studentsim/core/llm.py tests
      - name: Pytest
        run: pytest -q
