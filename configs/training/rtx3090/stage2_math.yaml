# Single RTX 3090 (24 GB) starting profile -- math Stage 2.
base_model: Qwen/Qwen3-4B-Instruct-2507
stage: 2

data_path: math/stage2/{student_id}.jsonl
output_dir: math/rtx3090/stage2/{student_id}
initial_adapter: math/rtx3090/stage1/adapter

per_device_batch: 1
gradient_accumulation: 32
world_size: 1
effective_batch: 32

max_seq_len: 2048
precision: bf16
gradient_checkpointing: true

epochs: 3.0
multi_turn_ratio: 0.20
save_freq: 5
save_total_limit: 3

trainer_seed: 42
data_sampler_seed: 42

lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

optimizer:
  name: adamw_torch_fused
  learning_rate: 5.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  schedule: cosine
  warmup_steps: 30
